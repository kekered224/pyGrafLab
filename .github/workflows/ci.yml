name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (Ubuntu 26.04) no longer provides Python 3.9/3.10 builds.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package, web and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"
      - name: Unit tests
        run: python -m pytest tests -q
      # examples/run_example.py needs a .gfc model, which is downloaded by
      # the user (see README.md) and is deliberately not part of CI.
      - name: Build wheel
        run: python -m pip wheel . -w dist --no-deps

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the UI scripts
        run: |
          node --check pygraflab/web/static/app.js
          node --check pygraflab/web/static/plot.js
