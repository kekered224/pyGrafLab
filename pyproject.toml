[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygraflab"
# Packaging needs a version string; it carries no release semantics here.
version = "0.0.0"
description = "Python port of the GrafLab 2.1.4 spherical harmonic synthesis engine, with an offline web UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "pyGrafLab contributors" },
]
keywords = [
    "geodesy",
    "gravity-field",
    "spherical-harmonics",
    "geopotential",
    "graflab",
    "geoid",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/kekered224/pyGrafLab"
Repository = "https://github.com/kekered224/pyGrafLab"
Issues = "https://github.com/kekered224/pyGrafLab/issues"

[project.optional-dependencies]
web = ["flask>=2.3"]
mat = ["h5py>=3.0"]
fast = ["numba>=0.57"]
dev = ["pytest>=7.0"]

[project.scripts]
pygraflab-web = "pygraflab.web.server:main"

[tool.setuptools.packages.find]
include = ["pygraflab*"]

[tool.setuptools.package-data]
"pygraflab.web" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.png",
    "static/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
